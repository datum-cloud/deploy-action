name: Release

# Moves the major version tag (for example v1) to each published, non
# prerelease vX.Y.Z release so that `uses: datum-cloud/deploy-action@v1`
# follows the latest compatible release. The tag moves only forward, and only
# to a commit on main.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  major-tag:
    name: Update major version tag
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Move major tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! [[ "${TAG}" =~ ^v([1-9][0-9]*)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag ${TAG} is not vX.Y.Z with X >= 1; not moving a major tag"
            exit 1
          fi
          major="v${BASH_REMATCH[1]}"
          if ! git merge-base --is-ancestor "${TAG}^{commit}" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::${TAG} is not on ${DEFAULT_BRANCH}; not moving ${major}"
            exit 1
          fi
          latest=$(git tag --list "${major}.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ "${latest}" != "${TAG}" ]; then
            echo "::notice::${TAG} is older than ${latest}; leaving ${major} where it is"
            exit 0
          fi
          git tag -f "${major}" "${TAG}^{commit}"
          git push -f origin "refs/tags/${major}"
          echo "Moved ${major} to ${TAG}"
