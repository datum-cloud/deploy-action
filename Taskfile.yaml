version: '3'

vars:
  ACTIONLINT_VERSION: v1.7.12

tasks:
  ci:
    desc: Run every check CI runs
    cmds:
      - task: lint
      - task: test

  lint:
    desc: Lint the action metadata, workflows and shell scripts
    cmds:
      - task: lint:actions
      - task: lint:shell

  lint:actions:
    desc: Lint the workflows, and action.yaml through the workflows that use it
    cmds:
      - go run github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}}

  lint:shell:
    desc: Lint the shell scripts with shellcheck
    cmds:
      - shellcheck scripts/*.sh test/*.sh

  test:
    desc: Test the deploy script against a stub datumctl
    cmds:
      - bash test/deploy_test.sh
